# Render Blueprint — free web service (https://render.com/docs/blueprint-spec)
services:
  - type: web
    name: ielts-road
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DB_PATH
        value: ./data/db.json
      # Keeps sign-ins valid across restarts. Note: the free tier wipes the disk, so learner data is lost on restart.
      - key: SESSION_SECRET
        generateValue: true
      # Test phase: demo account created on start and prefilled on the login page (username:password).
      # Entered in the Render dashboard, never committed; leave empty in production.
      - key: DEMO_ACCOUNT
        sync: false
      # Optional: enables AI writing feedback. Entered in the Render dashboard, never committed.
      - key: ANTHROPIC_API_KEY
        sync: false
